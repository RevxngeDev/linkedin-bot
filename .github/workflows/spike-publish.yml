name: Phase 0 spike - publish one post

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to really publish the hard-coded post to LinkedIn'
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Publish spike post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_URN: ${{ secrets.LINKEDIN_MEMBER_URN }}
        run: uv run python -m linkedin_bot.publisher.spike
