# LLM provider settings (D-008, D-024). Change models here, never in code.
# Groq model ids and free-plan limits: https://console.groq.com/docs/models
provider: groq
model: openai/gpt-oss-120b
# Output budget per request. For gpt-oss models hidden reasoning tokens also count
# against it, so keep headroom above the length of one post.
max_completion_tokens: 4096
# gpt-oss models accept low | medium | high (Groq default: medium). Writing a post
# needs little reasoning; "low" leaves more of the budget for the text itself.
reasoning_effort: low
