[project]
name = "linkedin-bot"
version = "0.1.0"
description = "AI-assisted, human-approved publishing pipeline for a personal LinkedIn profile"
authors = [
    { name = "RevxngeDev" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
linkedin-bot-auth = "linkedin_bot.auth.oauth_helper:main"
linkedin-bot-publish = "linkedin_bot.publisher.run:main"
linkedin-bot-generate = "linkedin_bot.generator.run:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
